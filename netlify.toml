# Netlify deploy. Netlify detects Next.js and applies its Next.js runtime automatically.
# Required env vars (Site configuration → Environment variables): see docs/DEPLOY-NETLIFY.md
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Scheduled jobs: the same cron routes Vercel calls (see vercel.json), via scheduled functions.
[functions."cron-webhooks"]
  schedule = "*/10 * * * *"
[functions."cron-weekly-roi"]
  schedule = "0 13 * * 1"
[functions."cron-money-list-digest"]
  schedule = "0 14 1 * *"
[functions."cron-agency-rollup"]
  schedule = "0 15 1 * *"
